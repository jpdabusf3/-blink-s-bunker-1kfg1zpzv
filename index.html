    <script src="https://goskip.dev/skip.js"></script>
    <!-- @skip-protected: Do not remove. App entrypoint. -->
    <script type="module" src="/src/main.tsx"></script>

    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator && (window.location.protocol === 'https:' || window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')) {
        window.addEventListener('load', function () {
          // Guard against breaking Vite local HMR during development if requested
          if (!window.location.port || window.location.port === '4173' || window.location.protocol === 'https:') {
            navigator.serviceWorker
              .register('/sw.js')
              .then(function (reg) {
                console.log('[SW] Service Worker registrado com escopo:', reg.scope);
              })
              .catch(function (err) {
                console.warn('[SW] Falha ao registrar Service Worker:', err);
              });
          }
        });
      }
    </script>
  </body>
